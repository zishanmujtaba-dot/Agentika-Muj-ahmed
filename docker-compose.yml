services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: echo-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"          # matches PG_PORT in .env.example
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
    volumes:
      - echo_pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  neo4j:
    image: neo4j:5
    container_name: echo-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7689:7687"          # bolt - matches NEO4J_URI in .env.example
      - "127.0.0.1:7475:7474"          # http browser UI, at http://localhost:7475
    environment:
      NEO4J_AUTH: neo4j/password123   # matches NEO4J_USER/NEO4J_PASSWORD in .env.example
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
    volumes:
      - echo_neo4j_data:/data

  app:
    profiles: ["app"]
    build: .
    image: agentika-echo:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      PORT: "3000"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: ${PG_DBNAME:-postgres}
      PG_READONLY_USER: ${PG_READONLY_USER:-echo_runtime}
      PG_READONLY_PASSWORD: ${PG_READONLY_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      STAFF_USERNAME: ${STAFF_USERNAME:-staff}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      RETRIEVAL_MAX_DISTANCE: ${RETRIEVAL_MAX_DISTANCE:-0.60}

  bootstrap:
    profiles: ["setup"]
    build: .
    image: agentika-echo:local
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: ${PG_DBNAME:-postgres}
      PG_ADMIN_USER: ${PG_ADMIN_USER:-postgres}
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD:-postgres}
      PG_READONLY_USER: ${PG_READONLY_USER:-echo_runtime}
      PG_READONLY_PASSWORD: ${PG_READONLY_PASSWORD:-}
      STAFF_USERNAME: ${STAFF_USERNAME:-staff}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
    command: ["python", "scripts/bootstrap_container.py"]

volumes:
  echo_pg_data:
  echo_neo4j_data:
