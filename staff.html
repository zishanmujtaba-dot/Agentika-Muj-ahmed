<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ECHO - Staff View</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
  .ticket {
    border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .ticket .meta { font-size: 12px; color: #777; margin-bottom: 8px; }
  .ticket .query { font-size: 16px; margin-bottom: 10px; }
  .ticket textarea {
    width: 100%; min-height: 60px; padding: 8px; border-radius: 6px; border: 1px solid #ccc;
    box-sizing: border-box; font-family: inherit;
  }
  .ticket button {
    margin-top: 8px; padding: 8px 16px; background: #2563eb; color: white;
    border: none; border-radius: 6px; cursor: pointer;
  }
  .ticket button:disabled { background: #9ca3af; cursor: not-allowed; }
  .dept { display: inline-block; background: #eef2ff; color: #3730a3; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
  #empty { color: #888; }
</style>
</head>
<body>

<h2>ECHO staff queue</h2>
<p>Pending student questions the agent couldn't confidently answer. Reply here - it goes straight back into that student's chat.</p>

<div id="list"></div>
<p id="empty">No pending tickets.</p>

<script>
const BACKEND_URL = "http://localhost:8000";
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");

async function loadTickets() {
  try {
    const res = await fetch(BACKEND_URL + "/escalations");
    const tickets = await res.json();
    render(tickets);
  } catch (err) {
    listEl.innerHTML = "<p>Can't reach backend: " + err.message + "</p>";
  }
}

function render(tickets) {
  listEl.innerHTML = "";
  emptyEl.style.display = tickets.length ? "none" : "block";

  for (const t of tickets) {
    const div = document.createElement("div");
    div.className = "ticket";
    div.innerHTML = `
      <div class="meta">${new Date(t.created_at).toLocaleTimeString()} &middot; ${t.reason} &middot; <span class="dept">${t.department || "Unrouted"}</span></div>
      <div class="query">"${escapeHtml(t.student_query)}"</div>
      <textarea placeholder="Type your reply to the student..."></textarea><br/>
      <button>Send reply</button>
    `;
    const textarea = div.querySelector("textarea");
    const button = div.querySelector("button");

    button.addEventListener("click", async () => {
      const text = textarea.value.trim();
      if (!text) return;
      button.disabled = true;
      button.textContent = "Sending...";
      try {
        await fetch(`${BACKEND_URL}/escalations/${t.id}/reply?session_id=${encodeURIComponent(t.session_id || "")}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        loadTickets(); // refresh list - this ticket should now be gone (resolved)
      } catch (err) {
        button.disabled = false;
        button.textContent = "Send reply";
        alert("Failed to send: " + err.message);
      }
    });

    listEl.appendChild(div);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

loadTickets();
setInterval(loadTickets, 4000); // poll for new tickets every 4s
</script>

</body>
</html>
